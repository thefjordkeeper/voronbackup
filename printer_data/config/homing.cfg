[gcode_macro _HOME_X]
gcode:
    # Home
    {% set RUN_CURRENT_X = printer.configfile.settings['tmc5160 stepper_x'].run_current|float %}
    {% set RUN_CURRENT_Y = printer.configfile.settings['tmc5160 stepper_y'].run_current|float %}
    {% set HOME_CURRENT = 1.1 %}
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={HOME_CURRENT}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={HOME_CURRENT}
    
        ## Uncomment the following to temporarily change acceleration if you are getting TMC Driver Undercurrent errors. 
    {% set RUN_ACCEL = printer.configfile.settings['printer'].max_accel|int %}	
    {% set HOME_ACCEL = 100 %}
    SET_VELOCITY_LIMIT ACCEL={HOME_ACCEL}
    
    SET_KINEMATIC_POSITION X=15
    G91
    G1 X-15 F1200
    
    
    #M400 to finish all pending moves/process the buffer
    M400 
    G28 X0
    
    # Move away
    G91
    G1 X-15 F1200
    G4 P3000

    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={RUN_CURRENT_X}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={RUN_CURRENT_Y}
  
  ## Only uncomment if the code to modify acceleration above was uncommented.
    SET_VELOCITY_LIMIT ACCEL={RUN_ACCEL}

[gcode_macro _HOME_Y]
gcode:
    {% set RUN_CURRENT_X = printer.configfile.settings['tmc5160 stepper_x'].run_current|float %}
    {% set RUN_CURRENT_Y = printer.configfile.settings['tmc5160 stepper_y'].run_current|float %}
    {% set HOME_CURRENT = 1.1 %}
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={HOME_CURRENT}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={HOME_CURRENT}
        
        ## Uncomment the following to temporarily change acceleration if you are getting TMC Driver Undercurrent errors. 
    {% set RUN_ACCEL = printer.configfile.settings['printer'].max_accel|int %}	
    {% set HOME_ACCEL = 100 %}
    SET_VELOCITY_LIMIT ACCEL={HOME_ACCEL}
    
    SET_KINEMATIC_POSITION Y=15
    G91
    G1 Y-15 F1200
    
    #G4 P2000
    #M400 to finish all pending moves/process the buffer
    M400 
    
    # Home
    G28 Y
    # Move away
    G91
    G1 Y-15 F1200
    G4 P3000

    # Wait just a second… (give StallGuard registers time to clear)
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={RUN_CURRENT_X}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={RUN_CURRENT_Y}
  ## Only uncomment if the code to modify acceleration above was uncommented.
    SET_VELOCITY_LIMIT ACCEL={RUN_ACCEL}