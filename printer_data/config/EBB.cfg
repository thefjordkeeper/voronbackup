# This file contains common pin mappings for the BIGTREETECH EBB36
# GEN2 board. To use this config, the firmware should be compiled for the
# STM32G0B1 with "8 MHz crystal" and "USB (on PA11/PA12)" or "CAN bus (on PB12/PB13)" .
# The "EBB36 GEN2" micro-controller will be used to control the components on the nozzle.

# See docs/Config_Reference.md for a description of parameters.

[mcu EBB]
serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_320008000451343438333339-if00
restart_method: command
#canbus_uuid: e724fa12ffa2
#949ccd1fe1cc
#canbus_interface: can1

[temperature_sensor EBB36]
sensor_type: Generic 3950
sensor_pin: EBB:PA0
pullup_resistor: 2200

[lis2dw]
cs_pin: EBB:PB1
spi_bus:spi2_PB2_PB11_PB10
axes_map: x,y,z

[multi_pin Part_Fan]
pins: EBB:PD3, EBB:PA5

[fan]
pin=multi_pin:Part_Fan
max_power: 1.0
shutdown_speed: 0.0
#cycle_time: 0.5
hardware_pwm: false
kick_start_time: 0.10

[extruder]
step_pin: EBB:PB14
dir_pin: EBB:PA8
enable_pin: !EBB:PB6
microsteps: 16
rotation_distance: 4.49789
gear_ratio: 1:1
nozzle_diameter: 0.200
filament_diameter: 1.750
heater_pin: EBB:PB4
sensor_type: PT1000
sensor_pin: EBB:PA3
pullup_resistor: 2200
control: mpc
heater_power: 50 
cooling_fan: fan
filament_diameter: 1.75
filament_density: 1.20
filament_heat_capacity: 1.8
min_temp: 0
max_temp: 300
max_extrude_only_distance: 400
max_extrude_cross_section: 50
max_power: .7
min_extrude_temp: 0

[verify_heater extruder]
max_error: 20
check_gain_time:120
hysteresis: 50
heating_gain: 2

[tmc2209 extruder]
uart_pin: EBB:PB3
run_current: 0.8
hold_current: 0.1
sense_resistor: 0.110
stealthchop_threshold: 0

#[filament_switch_sensor fil_det]
#switch_pin: EBB:PD0

[heater_fan hotend]
pin: EBB:PD2
max_power: 1.0
shutdown_speed: 0.0
cycle_time: 0.5
heater: extruder

heater_temp: 50
hardware_pwm: false
kick_start_time: 0.50
#min_power: 0.1
tachometer_pin: EBB:PA4
tachometer_ppr: 2
tachometer_poll_interval: 0.0009

#[bltouch]
#sensor_pin: ^!EBB:PB8
#control_pin: EBB:PB5

#[output_pin rled]
#pin:EBB:PA2

